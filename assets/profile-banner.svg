<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Melvin Denish — I make complex feel clear</title>
  <desc id="description">A dark, handcrafted, glowing 3D network sphere with connected nodes and orbital paths.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08080c"/>
      <stop offset=".55" stop-color="#0b0b13"/>
      <stop offset="1" stop-color="#101021"/>
    </linearGradient>
    <radialGradient id="halo" cx="76%" cy="51%" r="49%">
      <stop stop-color="#665de8" stop-opacity=".23"/>
      <stop offset=".56" stop-color="#342e7e" stop-opacity=".12"/>
      <stop offset="1" stop-color="#09090e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".32" cy=".25" r=".82">
      <stop stop-color="#466bd6"/>
      <stop offset=".46" stop-color="#273061"/>
      <stop offset=".78" stop-color="#15172c"/>
      <stop offset="1" stop-color="#0b0c15"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#69e5ed"/>
      <stop offset=".55" stop-color="#8c9cff"/>
      <stop offset="1" stop-color="#c877e9"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f4f2fb"/>
      <stop offset=".76" stop-color="#cbc9df"/>
      <stop offset="1" stop-color="#8be9ef"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#cfcaee" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-.7" y="-.7" width="2.4" height="2.4">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="17"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#halo)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <path d="M0 293 1200 93M0 328 1200 128" stroke="#dcd8fa" stroke-opacity=".035"/>

  <text x="66" y="66" fill="#80e8ed" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="500" letter-spacing="3">PRODUCT ENGINEERING / APPLIED AI / GRAPH INTELLIGENCE</text>
  <text x="59" y="177" fill="url(#title)" font-family="Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-4">I MAKE COMPLEX</text>
  <text x="59" y="257" fill="#f1eff8" font-family="Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-4">FEEL <tspan fill="#6fe1eb">CLEAR.</tspan></text>
  <path d="M65 286h256" stroke="url(#cyan)" stroke-opacity=".75" stroke-width="1.5"/>
  <text x="66" y="320" fill="#9997ac" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1.8">SOFTWARE WITH A POINT OF VIEW · CHENNAI, INDIA</text>

  <g filter="url(#shadow)" transform="translate(923 179)">
    <circle r="103" fill="url(#core)" stroke="#8e91fc" stroke-opacity=".59" stroke-width="1.2"/>
    <path d="M-98-25C-59-74 22-112 95-57M-98 25C-36-20 27-14 98 17M-79 67C-26 25 30 39 77 69M-49-90C-31-50-25 9-40 95M13-101C43-54 47 29 17 101M62-78C24-29 22 24 56 84" fill="none" stroke="url(#cyan)" stroke-opacity=".34" stroke-width="1"/>
    <path d="m-65-43 36-38 44 24 31-35 50 49-12 52-45 38-46-26-43 28-35-45Zm36-38 14 76m30-52 22 100m-66-24 90-27m-90 27 89 17m-42-111 3 42 52 24m-97-51-4 96" fill="none" stroke="#b4b8ff" stroke-opacity=".5" stroke-width="1"/>
    <path d="M-111 7a111 111 0 0 1 218-30M-95-47a111 111 0 0 0 190 70M-71-87a116 116 0 0 1 131 169" fill="none" stroke="#9a8cff" stroke-opacity=".62" stroke-width="1"/>
    <circle cx="-65" cy="-43" r="4" fill="#8ff2f4" stroke="#e4ffff" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="-29" cy="-81" r="3.6" fill="#c79cff"/>
    <circle cx="15" cy="-57" r="5" fill="#c7a2ff" stroke="#f3e7ff" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="46" cy="-92" r="3.6" fill="#8df0f0"/>
    <circle cx="96" cy="-43" r="4.2" fill="#a9a0ff"/>
    <circle cx="84" cy="9" r="4.8" fill="#95eff6" stroke="#ebffff" stroke-width="1" filter="url(#glow)"/>
    <circle cx="39" cy="47" r="3.7" fill="#d397f2"/>
    <circle cx="-7" cy="21" r="4.8" fill="#94eaf2"/>
    <circle cx="-53" cy="49" r="3.5" fill="#a9adff"/>
    <circle cx="-88" cy="4" r="3.7" fill="#8ee7ef"/>
    <circle r="30" fill="#17192f" fill-opacity=".7" stroke="#7ba6ff" stroke-opacity=".43"/>
    <circle r="8" fill="url(#cyan)" filter="url(#glow)"/>
  </g>
  <g fill="#87e8f0" stroke="#defeff" stroke-width="1">
    <circle cx="754" cy="103" r="3.3"/><circle cx="1081" cy="80" r="3.2"/><circle cx="1111" cy="263" r="3.1"/>
  </g>
  <g fill="none" stroke="#96a2ff" stroke-opacity=".58" stroke-width="1">
    <path d="m814 104-41-21-27 15m318 9 45-25 27 15M1017 279l31 18 26-15"/>
  </g>
  <text x="1065" y="70" fill="#88869f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing="1.4">SYSTEMS / 001</text>
</svg>
